[project]
name = "data-lakes-practice"
version = "0.1.0"
description = "TP 1 - Introduction aux Pipelines de Données avec Data Lakes (Pfam)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "awscli>=1.44.0",
    "datasets>=4.4.0",
    "mysql-connector-python>=9.5.0",
    "pymongo>=4.15.0",
    "transformers>=5.0.0",
    "tqdm>=4.67.0"
]

[tool.uv]
dev-dependencies = [
    "jupyter",
    "notebook",
    "matplotlib",
    "seaborn"
]
